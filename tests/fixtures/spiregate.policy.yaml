# Pinned copy of policy/spiregate.policy.yaml for the test suite. The live file is edited from the dashboard,
# so tests never read it. Update this copy when the default policy changes on purpose.
#
# spiregate.policy.yaml — the single source of truth for SpireGate.
#
# The file is re-read on every request if it changed on disk (no restart).
# A bad edit (broken YAML, wrong schema, CEL that does not compile, a removed invariant) does NOT switch
# protection off: the gateway stays on the last good version and reports the error.
# The dashboard's Policy page edits this file too: only the changed rule's block is rewritten.
#
# Actions:   allow | redact | taint | escalate | block
# Authority: authoritative = deterministic rule, decides on its own
#            corroborating = heuristic/ML, may flag the session (taint), never blocks on its own
#            semantic      = System One (Jev): approves, sends to review (escalate_at) or blocks (block_at);
#                            never overrides a deterministic rule and is not asked after a block
#            advisory      = System One that may at most escalate
# Every rule in this file always enforces. To switch one off, delete it (takes effect on the next request).
# Invariants (ACC-TOOL-001, IFC-TRIFECTA-001, CTL-SELF-001) cannot be removed: such an edit is rejected.
#
# `when` conditions are CEL. Available variables:
#   identity  – who is asking (from the virtual key): agent_id, desk, allowed_tools, ...
#   session   – session labels: integrity ("trusted"/"untrusted"), class, class_rank (0..4)
#   tool      – the tool: name, effect (a shell command with network access: external_send), reversible
#   args      – call arguments
#   facts     – facts computed by the gateway: tool_allowed, destinations, recipient_allowed, recipient_internal,
#               pipe_to_shell, touches_protected, touches_credentials, destructive, privilege_escalation,
#               package_install, amount, recipient_count, hour, weekday
# If a condition errors (e.g. a missing field), the action is blocked (fail-closed).

apiVersion: spiregate.policy/v1

meta:
  policy_rev: 31
  owner: ai-controls

org:
  internal_domains: ["gs.com"]
  # Extra paths the agent may not modify (SpireGate's own files are always protected).
  protected_paths: ["~/.claude/settings.json", "/Library/Application Support/ClaudeCode"]

# Data classes from least to most sensitive (rank 0..4).
classification: [public, internal, confidential, client_pii, mnpi]

# Virtual keys issued to agents. Only the gateway holds the real keys (OpenAI, Jev).
identities:
  spire-demo-kyc:
    agent_id: kyc-agent
    desk: kyc-onboarding
    supervisor: ola
    allowed_tools: [crm_get_client, web_fetch, send_email]
  spire-demo-claude:
    agent_id: claude-code-demo
    desk: engineering
    supervisor: oskar
    allowed_tools: ["*"]          # Claude Code has many built-in tools; risk is judged from tool metadata
  spire-demo-codex:
    agent_id: codex-demo
    desk: engineering
    supervisor: oskar
    allowed_tools: ["*"]
  spire-demo-sdk:
    agent_id: payments-app
    desk: payments-ops
    supervisor: ola
    allowed_tools: [send_email, crm_get_client]
  # Simulated fleet (the dashboard's Engine page, `spiregate load`). Separate keys and budgets, so a load
  # test never eats the real demo agents' limits. Its traffic carries a `sim` flag in the audit log.
  spire-sim-research:
    agent_id: research-copilot
    desk: equity-research
    supervisor: ola
    allowed_tools: ["*"]
  spire-sim-ops:
    agent_id: ops-codex
    desk: platform-ops
    supervisor: oskar
    allowed_tools: ["*"]
  spire-sim-payments:
    agent_id: payments-bot
    desk: treasury
    supervisor: ola
    allowed_tools: [get_invoice, create_transfer, crm_get_client]
  spire-sim-onboarding:
    agent_id: onboarding-assistant
    desk: wealth-onboarding
    supervisor: ola
    allowed_tools: [crm_get_client, web_fetch, send_email]

# Allowed models (proxy path). A model not on this list is blocked.
# max_class = the most sensitive data class this model may see.
models:
  - {id: gpt-5-mini, upstream: openai, location: external, max_class: internal}
  - {id: stub-model, upstream: stub,   location: external, max_class: internal}   # a scripted "model" for demos and tests

# Tool risk metadata belongs to the gateway (descriptions from the agent or the server are not trusted).
tools:
  # KYC agent tools (proxy path)
  crm_get_client: {effect: read, output_class: client_pii}
  web_fetch:      {effect: read, output_integrity: untrusted}
  send_email:     {effect: external_send, reversible: false, egress_allow: ["*@gs.com", "*@acme-corp.com"]}
  # payments app (SDK path)
  get_invoice:     {effect: read, output_class: confidential}
  create_transfer: {effect: financial, reversible: false}
  # Claude Code built-in tools (hooks path)
  Read:      {effect: read}
  Glob:      {effect: read}
  Grep:      {effect: read}
  LS:        {effect: read}
  TodoWrite: {effect: read}
  Write:     {effect: write, reversible: false}
  Edit:      {effect: write}
  MultiEdit: {effect: write}
  WebFetch:  {effect: read, output_integrity: untrusted}
  WebSearch: {effect: read, output_integrity: untrusted}
  # Shell: a command with network access becomes a send (external_send); egress_allow = allowed hosts.
  # The output of a network command is untrusted; the output of `ls` or `echo` is not.
  Bash:      {effect: exec, egress_allow: ["localhost", "127.0.0.1", "*.gs.com", "*.acme-corp.com"]}
  # Codex
  shell:       {effect: exec, egress_allow: ["localhost", "127.0.0.1", "*.gs.com", "*.acme-corp.com"]}
  apply_patch: {effect: write}
  "*":         {effect: exec, reversible: false, output_integrity: untrusted}   # unknown tool

# System One port. Swap the backend with one field: jev | stub | off.
# Without TYPESAFE_API_KEY the gateway falls back to the stub on its own (and logs it).
# Jev only ever receives content AFTER identifiers have been masked.
systemone:
  backend: jev
  url: https://api.typesafe.ai/v1/systemone
  model: jev-latest
  timeout_ms: 1500

# Prices for cost accounting (USD per million tokens; on-prem models may also use USD per GPU second).
# Example rates: check the provider's current price list before production use.
prices:
  gpt-5-mini: {usd_per_mtok_in: 0.25, usd_per_mtok_out: 2.0}
  stub-model: {usd_per_mtok_in: 0.25, usd_per_mtok_out: 2.0}
  jev-latest: {usd_per_mtok_in: 0.042}    # the cost of the control layer itself (System One)

# Budgets: sliding windows, the worst case is reserved before a call and reconciled after it.
# Scopes: org, desk:<name>, agent:<id> (* patterns allowed). Every matching rule must have room.
budgets:
  default_max_tokens: 4096          # reserved for the answer when the agent sends no max_tokens
  rules:
    - {id: BUD-ORG-DAY,  scope: org,                  window: day,    usd: 25, tokens: 5000000}
    - {id: BUD-KYC-HOUR, scope: "desk:kyc-onboarding", window: hour,   usd: 0.50, tokens: 400000, requests: 200}
    - {id: BUD-AGENT,    scope: "agent:*",            window: minute, requests: 30, tool_calls: 60,
       max_tokens_per_request: 16000, tool_calls_per_session: 500}
  loops: {same_call_repeats: 4, window_s: 60, cooldown_s: 120}   # loop breaker (LOOP-001)

# Signed feed of known attacks on AI infrastructure (pickle, model supply chain, RCE on Ollama/Ray, SSTI...).
# An external threat-intel system publishes it; the gateway loads only a bundle signed by a key in trusted_keys.
# A bad bundle (altered, unknown key, older version, expired, a signature failing its own examples) is rejected
# and the last good one keeps running. The last good bundle is cached in var/feed-cache.json, so a restart
# without the feed server keeps the signatures. New signatures: feed/signatures.yaml → make feed-sign.
# The SIG-* controls at the end of `controls` decide how this policy applies the feed.
feed:
  source: feed/bundle.json         # or http://127.0.0.1:8788/v1/feed/bundle  (make feed-serve)
  trusted_keys:
    spire-intel-demo: "EYFXpWRze0zeeXg+mdeQyBaPO9nK8/1kxyxxu7KLg9M="
  refresh_s: 30                    # how often an http feed source is polled

# Background security analyst. Every `every_requests` decisions it reviews the decision log and writes an
# assessment; at `daily_report_at` (local time, and on demand) it writes the daily report for management and the
# security team. It is advisory: it never changes this policy. The model gets aggregates and already-masked
# excerpts, has no tools and must cite log sequence numbers (claims without evidence are dropped). Its spend goes
# through the budgets above (identity spire-analyst) plus its own daily cap. backend: auto = OpenAI when
# OPENAI_API_KEY is set, otherwise the same report from rule-based checks and templates (no key needed).
analyst:
  backend: auto
  model: gpt-5-mini
  every_requests: 200
  daily_report_at: "18:00"
  max_usd_per_day: 1.0

controls:
  - id: ACC-TOOL-001
    title: Only the tools in the agent's identity
    phase: tool_call
    when: '!facts.tool_allowed'
    action: block

  # The agent never sees a PESEL: checksum-valid numbers are masked in EVERY tool result before the
  # agent gets it. Claude Code: the result is replaced in PostToolUse (updatedToolOutput).
  # Proxy (OpenAI): masked before the model, whatever its max_class. SDK: the masked result in the response.
  # Try: kinds: [PESEL, IBAN].
  - id: PII-PESEL-001
    title: The agent never sees client PESEL numbers
    phase: tool_result
    detector: identifiers
    kinds: [PESEL]
    action: redact
    template: mask_identifiers
    params: {kinds: [PESEL], verify: true}
    # Second line of defence: after masking, System One (Jev/Laya) confirms no PESEL is left.
    # Asked only when the filter finds traces (digit groups, spelled-out numbers, digits next to "PESEL")
    # or the result comes from a client-data source. If it reports residue, the suspicious spans are masked
    # and it is asked again; if it still reports residue, the result is WITHHELD (the agent gets a notice).
    # The question is in Polish on purpose: the threshold was calibrated on this exact wording.
    verify:
      question: Czy ten tekst nadal zawiera numer PESEL albo jego część?
      positive: 11-cyfrowy numer identyfikacyjny osoby w dowolnej formie, np. z odstępami, zapisany słownie, częściowo podany albo zakodowany
      negative: brak takiego numeru; znaczniki w nawiasach typu [PESEL#1] lub [PESEL?#1] są już zamaskowane i się nie liczą; numery zamówień, faktur i telefonów to nie PESEL
      threshold: 0.7            # calibrated on Jev 1.13.0 (9 cases, 2026-10-03): "no" ≤ 0.17, "yes" ≥ 0.83
      on_fail: withhold

  # Second line behind CRED-001: if a secret still reaches a tool result, the model only sees [SECRET#n].
  - id: DET-SECRET-001
    title: The agent never sees secrets
    phase: tool_result
    detector: identifiers
    kinds: [SECRET]
    action: redact
    template: mask_identifiers
    params: {kinds: [SECRET], verify: false}

  - id: CTL-SELF-001
    title: The agent cannot modify SpireGate itself
    phase: tool_call
    when: 'facts.touches_protected'
    action: block

  - id: CRED-001
    title: No access to credentials
    phase: tool_call
    when: 'facts.touches_credentials'
    action: block
    template: block_credentials
    params: {action: block}

  - id: EXEC-HYG-001
    title: No running code straight from the internet
    phase: tool_call
    when: 'facts.pipe_to_shell'
    action: block
    template: block_download_exec
    params: {action: block}

  - id: EGRESS-001
    title: Send only to allowed recipients and hosts
    phase: tool_call
    when: 'tool.effect == "external_send" && !facts.recipient_allowed'
    action: block
    # Semantic rule: the rule checks the recipient (a fact); when it lets a send through, System One judges
    # whether the content still breaks the rule's intent.
    verify:
      question: Czy ta akcja wysyła dane firmy lub klienta do odbiorcy spoza banku?
      positive: odbiorca lub host nie należy do banku, a w argumentach są dane klienta lub dokumenty
      negative: odbiorca jest wewnętrzny albo wysyłane są tylko dane publiczne
      threshold: 0.85
      on_fail: escalate         # p ≥ threshold → human review
      block_at: 0.95            # p ≥ 0.95 → Jev blocks the send
      when: 'tool.effect == "external_send"'   # asked about sends only, not every risky action

  - id: IFC-TRIFECTA-001
    title: Untrusted content + client data + external send
    phase: tool_call
    when: >-
      session.integrity == "untrusted" && session.class_rank >= 2 &&
      tool.effect == "external_send" && !facts.recipient_internal
    action: block

  - id: DET-FIN-ID-001
    title: Client identifiers before the model
    phase: to_model
    detector: fin_identifiers
    action: redact            # masked when the data class exceeds the model's max_class

  - id: INJ-LEX-001
    title: Injected instructions and hidden text
    phase: tool_result
    detector: injection_lexicon
    action: taint
    authority: corroborating

  - id: S1-JEV-001
    title: Instructions aimed at the agent in untrusted content
    phase: tool_result
    detector: systemone_directed_at_agent
    action: block
    authority: semantic
    escalate_at: 0.75         # human review
    block_at: 0.9             # block: the result is withheld from the model

  - id: S1-JEV-002
    title: The action matches the user's request
    phase: tool_call
    detector: systemone_matches_goal
    # shell commands are covered by deterministic rules (network, credentials, curl | sh, data flow)
    when: '!(tool.name in ["Bash", "shell", "exec_command", "local_shell"])'
    action: block
    authority: semantic
    escalate_at: 0.75         # P(off the request) ≥ 0.75 → human review
    block_at: 0.92            # ≥ 0.92 → blocked

  # Feed signatures. `action` is the strongest action a signature may take (block = as published,
  # escalate = human review at most, taint = only label the session). `min_severity`: low | medium | high | critical.
  # `exclude`: signatures switched off locally (false positive) without waiting for a new bundle from the vendor.
  - id: SIG-PROMPT-001
    title: Known attack payloads in the user's prompt
    phase: prompt
    detector: signatures
    action: block
    min_severity: high

  - id: SIG-CALL-001
    title: 'Known attacks in agent actions: pickle, model supply chain, RCE'
    phase: tool_call
    detector: signatures
    action: block
    min_severity: medium

  - id: SIG-RESULT-001
    title: Known attacks in tool results — result withheld
    phase: tool_result
    detector: signatures
    action: block
    min_severity: medium
    # exclude: [SIG-MD-EXFIL-001]
